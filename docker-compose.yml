version: '2.3'

services:
  web:
    container_name: chitchat-qa
    restart: always
    build: .
    runtime: nvidia
    environment:
      - LANG=en_US.UTF-8
      - ELASTICSEARCH_HOST=elasticsearch
      - ELASTICSEARCH_PORT=9200
      - ELASTICSEARCH_INDEX=once
      # Synthetic data teacher model (must be <= 7B to match Topic 3 requirements)
      - TEACHER_MODEL_NAME=typhoon-ai/llama3.2-typhoon2-3b
      - TEACHER_DEVICE=cuda
    ports:
      - "3000:3000" #web-client
    volumes:
      # Cache HF models so the container doesn't re-download each rebuild
      - hf_cache:/root/.cache/huggingface
    depends_on:
      - elasticsearch

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.9
    container_name: chitchat-elasticsearch
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"

volumes:
  hf_cache:
